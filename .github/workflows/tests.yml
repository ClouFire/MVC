name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: suite-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uroot -psuite-test-only -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:coverage
        env:
          XDEBUG_MODE: coverage
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: suite-test-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-php-${{ matrix.php }}
          path: tests/.coverage/
