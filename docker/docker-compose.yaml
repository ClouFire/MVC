services:
  app:
    build:
      context: ..
      dockerfile: docker/image/dockerfile
    volumes:
      - ..:/var/www
    env_file:
      - ../.env
    networks:
      - app
  db:
    image: mysql:8.0
    container_name: ${DB_HOST:-mysql_db}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-my_database}
    ports:
     - "${DB_PORT:-3306}:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - app

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/var/www/public
    restart: always
    depends_on:
      - app
    networks:
      - app
networks:
  app:
    driver: bridge
