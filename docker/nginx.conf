server {
    listen 80;
    server_name docker-app-1;
    root /var/www/public;
    index index.php;

    location /public/assets/ { try_files $uri =404; 
    }
    location /public/vendor/ { try_files $uri =404; 
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass docker-app-1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }
}